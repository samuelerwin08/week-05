<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Isian</title>
</head>
<body>
    <h1><a href="cv.html">Data Diri</a></h1>

    
    <form action="terima.html" method="GET">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Samuel Erwin"><br>

        <label for="namap">Nama panggilan</label>
        <input type="text" id="namap" name="namap" placeholder="Sammy"><br>
    
        <label for="nrp">Nomor Reg Mhs</label>
        <input type="text" id="nrp" name="nrp" placeholder="225170716"><br>

        <label for="pwd">Kata Kunci</label>
        <input type="password" id="pwd" name="pwd"><br>

        <label for="surel">Alamat email</label>
        <input type="email" id="surel" name="surel" placeholder="istts@gmail.com"><br>

        <label for="telp">Nomor telp</label>
        <input type="tel" id="telp" name="telp" placeholder="08xxxxxxx"><br>

        <br><br>
        <label>Jenis Kelamin</label><br>
        <fieldset id="gender">
            <input type="radio" id="lk" name="gender" value="L"><label for="lk">Laki-Laki</label></radio><br>
            <input type="radio" id="pr" name="gender" value="P"><label for="pr">Perempuan</label></radio><br>
            <input type="radio" id="tb" name="gender" value="X" checked><label for="tb">Tersembunyi</label></radio><br>
        </fieldset>

        <br><br>
        <label>Bisa apa saja?</label><br>
        <fieldset id="kemampuan">
            <input type="checkbox" id="phs" name="kemampuan" value="PS">
            <label for="phs">Photoshop</label><br>

            <input type="checkbox" id="ail" name="kemampuan" value="AI">
            <label for="ail">Illustrator</label><br>
        </fieldset>

        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
